<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAVA Marketing Workspace</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="js/domain.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/store.js"></script>
</head>
<body>
<div id="demo-banner" class="demo-banner" hidden>Dữ liệu minh họa — không phải dữ liệu thật</div>
<div class="layout">
  <aside class="sidebar">
    <div class="wordmark">SAVA Marketing Workspace</div>
    <nav id="main-nav" aria-label="Điều hướng chính"></nav>
    <div class="sidebar-foot">
      <div id="connection-status" class="conn-status">Đang kiểm tra kết nối…</div>
      <label class="user-picker">Người dùng hiện tại
        <select id="current-user-select"></select>
      </label>
    </div>
  </aside>
  <main id="app" class="main" tabindex="-1">
    <div class="state-box">Đang tải…</div>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
